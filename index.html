<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>레시피 모음</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
    <link rel="stylesheet" href="app.css?v=4" />
    <link rel="stylesheet" href="recipes.css?v=3" />
  </head>
  <body>
    <header class="brand"><h1><svg class="icon brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M7 15c-2.6-.5-3.8-2.6-3.2-4.6.6-2 2.8-3 4.6-2.2C9 5.9 10.4 4.5 12 4.5s3 1.4 3.6 3.7c1.8-.8 4 .2 4.6 2.2.6 2-.6 4.1-3.2 4.6V20H7z"/><path d="M7 16.5h10"/></svg><span class="hl">레시피 모음</span></h1></header>
    <main class="wrap" id="app"><p class="empty">불러오는 중…</p></main>
    <nav class="tab-bar" id="tabbar" aria-label="메인 메뉴"></nav>

    <script src="recipes-data.js?v=5"></script>
    <script src="app.js?v=2"></script>
    <script>
      (function () {
        "use strict";
        var A = window.App;
        var D = window.RECIPES_DATA;
        if (!A || !D) {
          document.getElementById("app").innerHTML = '<p class="empty">화면을 불러오지 못했습니다. 새로고침해 주세요.</p>';
          return;
        }

        /* 한 줄 = 재료 하나. "이름 — 덧붙임"이면 덧붙임은 아래 작은 글씨, "이름: 내용"이면 이름을 굵게 */
        function item(t, wide) {
          var note = "", cut = t.indexOf(" — ");
          if (cut > 0) { note = t.slice(cut + 3); t = t.slice(0, cut); }
          var m = /^([^:\s][^:]{0,11}): (.+)$/.exec(t);
          return "<li" + (wide ? ' class="wide"' : "") + ">" + (m ? '<b class="lbl">' + A.esc(m[1]) + "</b> " + A.esc(m[2]) : A.esc(t)) +
            (note ? '<small class="note">' + A.esc(note) + "</small>" : "") + "</li>";
        }
        /* 짧은 재료가 여럿이면 두 단으로. 긴 줄(덧붙임 있는 줄)은 뒤로 보내 한 줄을 다 쓴다 */
        function isShort(t) { return t.indexOf(" — ") < 0 && t.length <= 12; }
        function list(items, ordered) {
          if (ordered) return '<ol class="steps">' + items.map(function (t) { return item(t); }).join("") + "</ol>";
          var shorts = items.filter(isShort);
          if (items.length >= 3 && shorts.length >= 2) {
            return '<ul class="items cols">' + shorts.map(function (t) { return item(t); }).join("") +
              items.filter(function (t) { return !isShort(t); }).map(function (t) { return item(t, true); }).join("") + "</ul>";
          }
          return '<ul class="items">' + items.map(function (t) { return item(t); }).join("") + "</ul>";
        }
        function section(id, s) {
          /* 재료 · 도구는 묶음이 없어도 상자 하나에 담는다 */
          var inner = s.groups ? s.groups.map(function (g) {
            return '<div class="grp"><p class="grp-label">' + A.esc(g.label) + "</p>" + list(g.items, s.ordered) + "</div>";
          }).join("") : /^(재료|도구)$/.test(s.heading) ? '<div class="grp' + (s.heading === "도구" ? " tool" : "") + '">' + list(s.items, s.ordered) + "</div>" : list(s.items, s.ordered);
          return '<section class="sec" id="' + id + '"><h3>' + A.esc(s.heading) + "</h3>" + inner + "</section>";
        }
        function sectionText(s) {
          return s.heading + " " + (s.groups ? s.groups.map(function (g) { return g.label + " " + g.items.join(" "); }).join(" ") : s.items.join(" "));
        }
        /* 레시피 하나 = 카드 하나. 열면 재료 · 만드는 법 · 메모가 한 번에 다 보인다.
           레시피라 하기 어려운 참고 내용(subs)은 카드 맨 아래 ＋ 줄로 접어 둔다 */
        function recipeCard(r) {
          var subs = (r.subs || []).map(function (g, gi) {
            var gid = "r-" + r.id + "-g" + gi;
            return A.fold({ inner: true, id: gid, name: g.title, body: A.guide(g.sections.map(function (s, i) { return section(gid + "-s" + i, s); }).join("")) });
          });
          var body = r.sections.map(function (s, i) { return section("r-" + r.id + "-s" + i, s); }).join("") +
            (r.notes.length ? section("r-" + r.id + "-notes", { heading: "메모", items: r.notes }) : "") +
            A.innerList(subs);
          return A.fold({ card: true, id: "r-" + r.id, name: r.title, body: body });
        }

        var entries = [];
        var tabs = D.categories.map(function (c) {
          var recipes = D.recipes.filter(function (r) { return r.category === c.id; });
          recipes.forEach(function (r) {
            var open = ["r-" + r.id];
            entries.push({ name: r.title, where: c.name, text: r.title, go: { tab: c.id, open: open } });
            r.sections.forEach(function (s, i) {
              entries.push({ name: r.title, where: c.name + " · " + s.heading, text: sectionText(s), go: { tab: c.id, open: open, focus: "r-" + r.id + "-s" + i } });
            });
            if (r.notes.length) entries.push({ name: r.title, where: c.name + " · 메모", text: r.notes.join(" "), go: { tab: c.id, open: open, focus: "r-" + r.id + "-notes" } });
            (r.subs || []).forEach(function (g, gi) {
              var gid = "r-" + r.id + "-g" + gi;
              entries.push({ name: g.title, where: c.name + " · " + r.title, text: g.title, go: { tab: c.id, open: open.concat([gid]) } });
              g.sections.forEach(function (s, i) {
                entries.push({ name: g.title, where: c.name + " · " + r.title + " · " + s.heading, text: sectionText(s), go: { tab: c.id, open: open.concat([gid]), focus: gid + "-s" + i } });
              });
            });
          });
          return {
            id: c.id, label: c.name, icon: c.id,
            html: recipes.length ? recipes.map(recipeCard).join("") : '<p class="empty">등록된 레시피가 없습니다</p>'
          };
        });

        A.start({ key: "recipes", searchLabel: "레시피 · 재료 검색", tabs: tabs, entries: entries });
      })();
    </script>
  </body>
</html>
