<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>복숭아 노트</title>
    <link rel="icon" type="image/svg+xml" href="peach-icon.svg" />
    <link rel="apple-touch-icon" href="peach-icon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="app.css?v=5" />
    <style>
      /* 복숭아 페이지는 강조색만 복숭아빛으로 바꾼다 */
      :root { --bg: #F8F1EE; --open-bg: #F6EAE6; --accent: #C94664; --accent-soft: #FADCE3; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #191414; --open-bg: #2D2425; --accent: #F28CA3; --accent-soft: #4A2430; }
      }
    </style>
  </head>
  <body>
    <header class="brand"><h1><svg class="icon brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M12 8c-4-2.2-8.5.2-8.5 5.1 0 4.4 3.8 7.9 8.5 7.9s8.5-3.5 8.5-7.9c0-4.9-4.5-7.3-8.5-5.1z"/><path d="M12 8c-1.2 3.8-1.2 8.6 0 13"/><path class="f" d="M12 8c-.8-2.6-2.9-4-5.6-3.8.6 2.7 2.8 4 5.6 3.8z"/></svg>복숭아 노트</h1></header>
    <main class="wrap" id="app"><p class="empty">불러오는 중…</p></main>
    <nav class="tab-bar" id="tabbar" aria-label="메인 메뉴"></nav>

    <script src="peaches-data.js?v=1"></script>
    <script src="app.js?v=2"></script>
    <script>
      (function () {
        "use strict";
        var A = window.App;
        var D = window.PEACHES_DATA;
        if (!A || !D) {
          document.getElementById("app").innerHTML = '<p class="empty">화면을 불러오지 못했습니다. 새로고침해 주세요.</p>';
          return;
        }
        var esc = A.esc, norm = A.norm;
        var SEASONS = ["극조생", "조생", "중생", "만생"];
        var V = D.varieties, F = D.farms, T = D.tastings;

        var byVarietyName = {};
        V.forEach(function (v) { [v.name].concat(v.aliases).forEach(function (n) { byVarietyName[norm(n)] = v; }); });
        var byFarmName = {};
        F.forEach(function (f) { byFarmName[norm(f.name)] = f; });
        function findVariety(name) { return byVarietyName[norm(name)] || null; }
        function findFarm(name) { return byFarmName[norm(name)] || null; }
        function goVariety(v) { return { tab: "varieties", sub: v.season, open: ["v-" + v.id] }; }
        function goFarm(f) { return { tab: "farms", open: ["f-" + f.id] }; }
        function goTasting(t) { return { tab: "tastings", open: ["t-" + t.id] }; }
        function varietyNames(v) { return [v.name].concat(v.aliases).map(norm); }
        function tastingsOfVariety(v) { var n = varietyNames(v); return T.filter(function (t) { return n.indexOf(norm(t.varietyName)) >= 0; }); }
        function farmsOfVariety(v) { var n = varietyNames(v); return F.filter(function (f) { return f.items.some(function (i) { return n.indexOf(norm(i)) >= 0; }); }); }
        function tastingsOfFarm(f) { return T.filter(function (t) { return norm(t.farmName) === norm(f.name); }); }
        function regionOf(f) { return (f.region || "").split(" ")[0] || "지역 미상"; }
        function specLine(t) { return [t.spec, A.won(t.price)].filter(Boolean).join(" · "); }
        function dateOf(t) { return t.tastedOn ? A.fmtDate(t.tastedOn) : "날짜 없음"; }
        function meta(label, html) { return html ? '<p class="meta"><b>' + esc(label) + "</b>" + html + "</p>" : ""; }
        function varietyLink(name) { var v = findVariety(name); return v ? A.link(name, goVariety(v)) : esc(name); }
        function farmLink(name) { var f = findFarm(name); return f ? A.link(name, goFarm(f)) : esc(name); }
        function tastingInner(t, id, title, info, linkHtml) {
          return A.fold({ inner: true, id: id, name: title, info: info, date: dateOf(t),
            body: A.guide((t.note ? '<p class="text">' + esc(t.note) + "</p>" : "") + meta("별점", A.stars(t.rating)) + linkHtml) });
        }

        /* 품종 */
        function varietyRow(v) {
          var farms = farmsOfVariety(v);
          var inner = tastingsOfVariety(v).map(function (t) {
            return tastingInner(t, "v-" + v.id + "-t-" + t.id, t.farmName || "농장 미상", specLine(t), meta("농장", t.farmName ? farmLink(t.farmName) : ""));
          });
          var body = (v.image ? '<img class="photo" src="' + esc(v.image) + '" alt="' + esc(v.name) + ' 복숭아" loading="lazy" />' : "") +
            (v.description ? '<p class="text">' + esc(v.description) + "</p>" : "") +
            meta("수확", esc(v.harvestWindow)) +
            meta("다른 이름", esc(v.aliases.join(" · "))) +
            meta("취급 농장", farms.map(function (f) { return A.link(f.name, goFarm(f)); }).join(" · ")) +
            (inner.length ? A.innerList(inner) : "");
          return A.fold({ id: "v-" + v.id, name: v.name, sum: [v.flesh, v.texture].filter(Boolean).join(" · "), body: body });
        }
        var varietySubs = SEASONS.map(function (s) {
          var list = V.filter(function (v) { return v.season === s; });
          return { id: s, label: s, count: list.length,
            html: A.card({ id: "season-" + s, icon: "peach", title: s, badge: list.length + "종", rows: list.map(varietyRow), empty: "등록된 품종이 없습니다" }) };
        });

        /* 농장 */
        function farmRow(f) {
          var links = f.storeLinks.map(function (u, i) { return '<a href="' + esc(u) + '" target="_blank" rel="noreferrer">판매처' + (f.storeLinks.length > 1 ? " " + (i + 1) : "") + " ↗</a>"; })
            .concat(f.socialLinks.map(function (u, i) { return '<a href="' + esc(u) + '" target="_blank" rel="noreferrer">소식' + (f.socialLinks.length > 1 ? " " + (i + 1) : "") + " ↗</a>"; }));
          var inner = tastingsOfFarm(f).map(function (t) {
            return tastingInner(t, "f-" + f.id + "-t-" + t.id, t.varietyName, specLine(t), meta("품종", varietyLink(t.varietyName)));
          });
          var body = meta("지역", esc(f.region)) +
            (f.description ? '<p class="text">' + esc(f.description) + "</p>" : "") +
            meta("품종", f.items.map(varietyLink).join(" · ")) +
            meta("링크", links.join(" · ")) +
            (inner.length ? A.innerList(inner) : "");
          return A.fold({ id: "f-" + f.id, name: f.name, sum: f.items.length ? "품종 " + f.items.length : "", body: body });
        }
        var regions = [];
        F.forEach(function (f) { var r = regionOf(f); if (regions.indexOf(r) < 0) regions.push(r); });
        regions.sort(function (a, b) {
          if (a === "지역 미상") return 1;
          if (b === "지역 미상") return -1;
          return F.filter(function (f) { return regionOf(f) === b; }).length - F.filter(function (f) { return regionOf(f) === a; }).length || a.localeCompare(b, "ko");
        });
        var farmCards = regions.map(function (r) {
          var list = F.filter(function (f) { return regionOf(f) === r; });
          return A.card({ id: "region-" + r, icon: "farm", title: r, badge: list.length + "곳", rows: list.map(farmRow) });
        }).join("");

        /* 시식 */
        function tastingRow(t) {
          var body = (t.note ? '<p class="text">' + esc(t.note) + "</p>" : "") +
            meta("규격 · 가격", esc(specLine(t))) +
            meta("별점", A.stars(t.rating)) +
            meta("품종", varietyLink(t.varietyName)) +
            meta("농장", t.farmName ? farmLink(t.farmName) : "");
          return A.fold({ id: "t-" + t.id, name: t.varietyName, sum: t.farmName, date: t.tastedOn ? A.fmtDate(t.tastedOn) : "", body: body || '<p class="empty">기록된 내용이 없습니다</p>' });
        }
        var months = [];
        T.forEach(function (t) { var m = t.tastedOn ? A.fmtDate(t.tastedOn.slice(0, 7)) : "날짜 없음"; if (months.indexOf(m) < 0) months.push(m); });
        var tastingCards = months.length ? months.map(function (m) {
          var list = T.filter(function (t) { return (t.tastedOn ? A.fmtDate(t.tastedOn.slice(0, 7)) : "날짜 없음") === m; });
          return A.card({ id: "month-" + m, icon: "note", title: m, badge: list.length + "건", rows: list.map(tastingRow) });
        }).join("") : '<p class="empty">시식 기록이 없습니다</p>';

        /* 검색 */
        var entries = [];
        V.forEach(function (v) { entries.push({ name: v.name, where: "품종 · " + v.season + " · " + [v.flesh, v.texture].filter(Boolean).join(" · "), text: [v.name].concat(v.aliases, [v.description, v.flesh, v.texture]).join(" "), go: goVariety(v) }); });
        F.forEach(function (f) { entries.push({ name: f.name, where: "농장 · " + (f.region || "지역 미상"), text: [f.name, f.region, f.description].concat(f.items).join(" "), go: goFarm(f) }); });
        T.forEach(function (t) { entries.push({ name: t.varietyName, where: "시식 · " + [t.farmName, dateOf(t)].filter(Boolean).join(" · "), text: [t.varietyName, t.farmName, t.note, t.spec].join(" "), go: goTasting(t) }); });

        A.start({
          key: "peaches",
          searchLabel: "품종 · 농장 · 시식 검색",
          tabs: [
            { id: "varieties", label: "품종", icon: "peach", subs: varietySubs },
            { id: "farms", label: "농장", icon: "farm", html: farmCards },
            { id: "tastings", label: "시식", icon: "note", html: tastingCards }
          ],
          entries: entries
        });
      })();
    </script>
  </body>
</html>
