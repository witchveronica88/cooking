    <title>복숭아 노트</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg:#fbf5ea; --dot:#efe3cc; --surface:#fffdf9; --sunken:#f7f0e4; --text:#33241b; --dim:#7d6b5d;
        --ink:#4a3628; --line:#e6dccb; --line-strong:#d3c5ae; --accent:#e0533f; --accent-dark:#b63c2b; --accent-soft:#fde4dc; --on-accent:#fff;
        --pink:#fde3e3; --butter:#fdf0c4; --mint:#dcf1e6; --sky:#e1ecfa;
        --radius:16px; --shadow:2px 2px 0 var(--ink);
        --display:"Jua","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
        --body:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1d1817; --dot:#2a2321; --surface:#272120; --sunken:#2f2826; --text:#f5e9da; --dim:#bda998; --ink:#7a5a4c; --line:#3a312e; --line-strong:#4d423d; --accent:#ff8a74; --accent-dark:#ffab99; --accent-soft:#4a2a24; --on-accent:#2a1410; --pink:#43292e; --butter:#40371f; --mint:#213a30; --sky:#232f40; }
      }
      * { box-sizing:border-box; }
      html { background:var(--bg); scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
      body { margin:0; min-width:320px; color:var(--text); font-family:var(--body); background-color:var(--bg); background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px); background-size:22px 22px; overscroll-behavior:none; -webkit-font-smoothing:antialiased; }
      button,input,textarea,select { font:inherit; color:inherit; }
      button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
      button:disabled { cursor:default; opacity:.45; }
      button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
      .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
      .app-shell { min-height:100vh; }
      .content-wrap { width:min(100%,560px); margin:0 auto; padding:calc(8px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }
      .subnav { position:sticky; top:0; z-index:8; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:8px; margin:0 -16px; padding:10px 16px; background:color-mix(in srgb,var(--bg) 88%,transparent); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
      .subnav:empty { display:none; }
      .subnav button { min-height:40px; border:1.5px solid var(--line-strong); border-radius:999px; background:var(--surface); color:var(--dim); font-size:15px; font-weight:700; transition:background .15s,color .15s,transform .1s; }
      .subnav button.on { border-color:var(--ink); background:var(--accent); color:var(--on-accent); box-shadow:var(--shadow); }
      .headline { margin:14px 2px 18px; }
      .headline h1 { display:inline; margin:0; font-family:var(--display); font-size:29px; line-height:1.3; font-weight:400; background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 28%,transparent) 62%); padding:0 2px; }
      .headline p { margin:10px 0 0; color:var(--dim); font-size:15px; font-weight:500; }
      .search { position:relative; display:block; margin:0 0 14px; }
      .search input { width:100%; min-height:46px; padding:0 44px 0 18px; border:1.5px solid var(--line-strong); border-radius:999px; background:var(--surface); font-size:16px; transition:border-color .15s; }
      .search input::placeholder { color:var(--dim); }
      .search input:focus { border-color:var(--ink); outline:none; }
      .search button { position:absolute; right:8px; top:8px; width:30px; height:30px; border:0; border-radius:50%; background:var(--butter); color:var(--text); font-size:20px; line-height:1; }
      .list { display:grid; gap:12px; }
      .card,.record { border:1.5px solid var(--ink); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); overflow:hidden; }
      .card>summary { list-style:none; min-height:68px; padding:15px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--pink); cursor:pointer; }
      .list>details:nth-child(4n+2)>summary { background:var(--butter); }
      .list>details:nth-child(4n+3)>summary { background:var(--mint); }
      .list>details:nth-child(4n)>summary { background:var(--sky); }
      .card>summary::-webkit-details-marker { display:none; }
      .card>summary>span { flex:1; min-width:0; }
      .card>summary strong { display:block; font-family:var(--display); font-size:19px; line-height:1.4; font-weight:400; }
      .card>summary small { display:block; margin-top:2px; color:color-mix(in srgb,var(--text) 68%,transparent); font-size:14px; line-height:1.45; }
      .card>summary i { flex:0 0 28px; width:28px; height:28px; display:grid; place-items:center; border:1.5px solid var(--ink); border-radius:50%; background:var(--surface); font-style:normal; font-size:18px; font-weight:600; line-height:1; transition:transform .2s ease; }
      .card[open]>summary i { transform:rotate(45deg); }
      .card[open]>summary { border-bottom:1.5px solid var(--ink); }
      .card-body { padding:4px 16px 18px; }
      .variety-heading { display:flex; align-items:center; gap:12px; }
      .variety-heading img { width:54px; height:54px; flex:0 0 54px; object-fit:cover; border:1.5px solid var(--ink); border-radius:12px; background:var(--surface); }
      .variety-heading em { display:block; margin-top:2px; color:var(--dim); font-size:13px; font-style:normal; }
      .card-body p { margin:10px 0 0; line-height:1.7; font-size:15px; }
      .muted { color:var(--dim); font-size:14px!important; }
      .preline { white-space:pre-line; }
      .mini-note { margin-top:12px; padding:12px 14px; border-radius:12px; background:var(--butter); color:var(--text); }
      .mini-note strong,.mini-note span { display:block; }
      .mini-note strong { font-size:14px; font-weight:700; }
      .mini-note span { margin-top:4px; font-size:14px; line-height:1.55; }
      .links { display:grid; gap:8px; margin-top:14px; }
      .links a { min-height:44px; display:flex; align-items:center; justify-content:space-between; padding:8px 16px; border:1.5px solid var(--ink); border-radius:999px; color:var(--text); text-decoration:none; font-size:15px; font-weight:700; transition:background .15s; }
      .links a:hover { background:var(--butter); }
      .filters { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
      .filters select { min-width:0; min-height:42px; padding:0 10px; border:1.5px solid var(--line-strong); border-radius:12px; background:var(--surface); font-size:15px; }
      .record { padding:16px; }
      .record-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
      .record h3 { margin:0; font-family:var(--display); font-size:19px; font-weight:400; }
      .record-top p { margin:2px 0 0; color:var(--dim); font-size:14px; }
      .record time { padding:2px 8px; border-radius:999px; background:var(--sunken); color:var(--dim); font-size:13px; white-space:nowrap; font-variant-numeric:tabular-nums; }
      .record>p { margin:10px 0 0; line-height:1.7; font-size:15px; }
      .record-meta { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:12px; padding-top:10px; border-top:1px dashed var(--line-strong); color:var(--dim); font-size:14px; }
      .stars { color:var(--accent); letter-spacing:.08em; }
      .bottom-nav { position:fixed; z-index:10; left:50%; bottom:0; transform:translateX(-50%); width:min(100%,560px); display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:7px 10px calc(7px + env(safe-area-inset-bottom)); border-top:1.5px solid var(--ink); background:color-mix(in srgb,var(--surface) 92%,transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
      .bottom-nav button,.bottom-nav a,.bottom-nav span { display:grid; place-items:center; text-decoration:none; min-height:50px; border:1.5px solid transparent; border-radius:14px; background:transparent; color:var(--dim); font-family:var(--display); font-size:16px; transition:color .15s,background .15s; }
      .bottom-nav .active { border-color:var(--ink); background:var(--butter); color:var(--text); box-shadow:var(--shadow); }
      .empty { padding:32px 12px; text-align:center; color:var(--dim); border:1.5px dashed var(--line-strong); border-radius:var(--radius); background:var(--surface); font-size:15px; }
      button:active:not(:disabled) { transform:translate(1px,1px); }
      @media (min-width:700px) { .content-wrap { padding-top:28px; } .bottom-nav { bottom:12px; width:min(calc(100% - 32px),420px); border:1.5px solid var(--ink); border-radius:18px; padding:6px; box-shadow:3px 3px 0 var(--ink); } }
      @media (max-width:370px) { .content-wrap { padding-left:12px; padding-right:12px; } .subnav { margin:0 -12px; padding:10px 12px; } .fact { grid-template-columns:72px minmax(0,1fr); } }
      @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; animation:none!important; } }
    </style>
  </head>

ases":[],"description":"공식 유래 자료 없이 아카츠키의 변이로만 알려짐. 황색 과육이 후숙되며 적색소가 돌고 쫄깃해짐. 후숙 전에는 산미가 뚜렷하다가 후숙 후 산미가 빠지며 진한 꿀향.","flesh":"황육","harvestWindow":"8월 초 - 8월 중","id":"v62","name":"허니골드","season":"중생","sortOrder":62,"source":"","texture":"쫀득이"},{"aliases":[],"description":"1958년 미국 농무부 육종프로그램 출신. 2016년 출원된 국산 옐로우레지나와 이름이 혼재. 노란 바탕에 붉은 착색, 단단하고 아삭. 완숙하면 과즙과 단맛이 오름. 씨가 잘 떨어져 샐러드 · 베이킹에도 적합.","flesh":"황육","harvestWindow":"7월 말 - 8월 초","id":"v63","name":"레지나","season":"중생","sortOrder":63,"source":"","texture":"딱딱이"},{"aliases":[],"description":"경북 성주에서 아부백도의 변이로 발견, 2008년 육성. 녹황색 바탕에 분홍빛 적색, 비대칭 과형에 큰 크기. 유백색 과육이 단단하고 아삭, 후숙하면 적색소가 깊게 발현. 당도와 식감이 안정적.","flesh":"백육","harvestWindow":"8월 중 - 8월 말","id":"v64","name":"성백","season":"중생","sortOrder":64,"source":"","texture":"딱딱이"},{"aliases":[],"description":"경북 김천 육성. 1999년 유명 포장에서 발견한 우연실생 선발, 2005년 명명 · 2008년 등록. 단단하고 아삭해 경도에서 오는 식감이 뛰어남. 후숙하면 붉은 기가 짙어지고 당도가 오름.","flesh":"백육","harvestWindow":"8월 초 - 8월 중","id":"v65","name":"대양","season":"중생","sortOrder":65,"source":"","texture":"딱딱이"},{"aliases":[],"description":"일본 야마나시현, 백봉의 만숙 대과성 아조변이. 1985년 등록. 250g 이상으로 백봉계 중 큼. 적백색으로 착색이 매우 잘 되고 유백색 과육이 치밀하며 잘 녹음. 13브릭스에 신맛이 적음. 착색이 빨라 일찍 따기 쉬우니 주의.","flesh":"백육","harvestWindow":"8월 초 - 8월 중","id":"v66","name":"장택백봉","season":"중생","sortOrder":66,"source":"kb","texture":"말랑이"},{"aliases":[],"description":"일본 후쿠시마 천향원, 마나미 × 유우조라. 2002년 국립원예특작과학원 도입. 200g · 12.7브릭스. 당도 높고 산미 적어 식미 우수. 생리적 낙과가 있고 해에 따라 당도 편차.","flesh":"황육","harvestWindow":"8월 중 - 8월 말","id":"v67","name":"스위트광황","season":"중생","sortOrder":67,"source":"kb","texture":"말랑이"},{"aliases":[],"description":"아카츠키 아조변이 선발계. 12.5브릭스. 유통기간이 길고 맛이 우수.","flesh":"백육","harvestWindow":"8월 초 - 8월 중","id":"v68","name":"영봉","season":"중생","sortOrder":68,"source":"rda","texture":"말랑이"},{"aliases":[],"description":"장호원황도의 조숙변이. 11.5브릭스. 반불용질성이라 맛이 좋고 유통기간이 긺.","flesh":"황육","harvestWindow":"8월 초 - 8월 중","id":"v69","name":"용성황도","season":"중생","sortOrder":69,"source":"rda","texture":"중간"},{"aliases" ":37900,"rating":4,"spec":"특대과 12과 2.4kg","tastedOn":"2025-08-07","varietyName":"골드로망"},{"createdAt":"2026-10-06T17:28:57.844Z","farmName":"피치컴퍼니","id":"seed1","note":"향과 맛에서 코코넛이 느껴진다!! 단맛이 은은하고 열대과일 향기가 많이 난다. 딱쫀이 정도의 황도라 만족!!","price":54000,"rating":5,"spec":"자이언트 8과 3kg","tastedOn":"2025-08-05","varietyName":"단황도 네오"},{"createdAt":"2026-10-06T17:28:57.844Z","farmName":"피치컴퍼니","id":"seed0","note":"SK언니 추천. 아주 사각사각한 편인 딱복. 후숙을 잔뜩 하면 쫀득 쪼꼼 가능. 아주 달진 않지만 적당히 달다. 맛있음!","price":54000,"rating":4,"spec":"자이언트 8과 3kg","tastedOn":"2025-08-01","varietyName":"경봉"},{"createdAt":"2026-10-06T17:28:57.844Z","farmName":"반도원","id":"seed3","note":"간신히 한 개 구해서 먹어본 납작복숭아… 맛있엉…","price":0,"rating":4,"spec":"","tastedOn":null,"varietyName":"납작복숭아"},{"createdAt":"2026-10-06T17:28:57.844Z","farmName":"도도명가","id":"seed6","note":"오 금봉에서 신기한 향이 난다!!!","price":0,"rating":4,"spec":"","tastedOn":null,"varietyName":"금봉"},{"createdAt":"2026-10-06T17:28:57.844Z","farmName":"도도명가","id":"seed7","note":"그레이트보다 진하고 밀도감이 있군!!","price":0,"rating":4,"spec":"","tastedOn":null,"varietyName":"홍금향"}]};

      };

      var data = SEED;

      function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
      function norm(value) { return String(value || "").replace(/\s|·|\([^)]*\)/g, "").toLowerCase(); }
      function won(value) { return value ? new Intl.NumberFormat("ko-KR").format(value) + "원" : ""; }
      function shortDate(value) { if (!value) return "날짜 없음"; var p = value.split("-"); return p[0] + ". " + Number(p[1]) + ". " + Number(p[2]); }

      var MAIN_TABS = [ { label: "요리", href: "index.html#cooking" }, { label: "음료", href: "index.html#drinks" }, { label: "복숭아", current: true } ];
      var SUB_TABS = [["varieties", "품종"], ["farms", "농장"], ["tastings", "시식 기록"]];
      var state = { sub: "varieties", search: "", season: "", flesh: "" };
      var openIds = {};

      var mainEl = document.getElementById("main");
      var subnavEl = document.getElementById("subnav");
      var bottomnavEl = document.getElementById("bottomnav");

      function searchBox(label) {
        return '<label class="search"><span class="sr-only">' + esc(label) + '</span><input data-role="search" aria-label="' + esc(label) + '" value="' + esc(state.search) + '" placeholder="' + esc(label) + '" />' +
          (state.search ? '<button type="button" data-action="clear-search" aria-label="검색어 지우기">×</button>' : "") + "</label>";
      }

      function varietyCard(variety) {
        var open = openIds["v:" + variety.id] ? " open" : "";
        var related = data.tastings.filter(function (t) {
          return norm(t.varietyName) === norm(variety.name) || variety.aliases.some(function (a) { return norm(a) === norm(t.varietyName); });
        });
        var farmNames = data.farms.filter(function (f) { return f.items.some(function (item) { return norm(item) === norm(variety.name); }); }).map(function (f) { return f.name; });
        var image = PEACH_IMAGES[variety.name];
        var meta = [variety.season, variety.flesh, variety.texture].filter(Boolean).join(" · ");
        var relatedHtml = related.map(function (r) {
          return '<div class="mini-note"><strong>' + esc(r.farmName) + (r.rating ? " " + "★".repeat(r.rating) : "") + "</strong><span>" + esc(r.note) + "</span></div>";
        }).join("");
        return '<details class="card variety-card" data-open-key="v:' + esc(variety.id) + '"' + open + '><summary><span class="variety-heading">' + (image ? '<img src="' + image + '" alt="' + esc(variety.name) + ' 복숭아" />' : "") + "<span><strong>" + esc(variety.name) + "</strong><small>" + esc(variety.harvestWindow) + "</small><em>" + esc(meta) + '</em></span></span><i aria-hidden="true">+</i></summary><div class="card-body"><p>' + esc(variety.description) + "</p>" +
          (variety.aliases.length ? '<p class="muted">다른 이름 · ' + esc(variety.aliases.join(" · ")) + "</p>" : "") +
          (farmNames.length ? '<p class="muted">취급 농장 · ' + esc(farmNames.join(" · ")) + "</p>" : "") +
          relatedHtml + "</div></details>";
      }

      function farmCard(farm) {
        var open = openIds["f:" + farm.id] ? " open" : "";
        var links = farm.storeLinks.map(function (u) { return { url: u, label: "판매처 열기" }; })
          .concat(farm.socialLinks.map(function (u) { return { url: u, label: "소식 보기" }; }))
          .map(function (l) { return '<a href="' + esc(l.url) + '" target="_blank" rel="noreferrer">' + l.label + '<span aria-hidden="true">↗</span></a>'; }).join("");
        return '<details class="card" data-open-key="f:' + esc(farm.id) + '"' + open + '><summary><span><strong>' + esc(farm.name) + "</strong><small>" + esc(farm.region || "지역 정보 없음") + '</small></span><i aria-hidden="true">+</i></summary><div class="card-body"><p class="preline">' + esc(farm.description) + "</p>" +
          (farm.items.length ? '<p class="muted">품종 · ' + esc(farm.items.join(" · ")) + "</p>" : "") +
          (links ? '<div class="links">' + links + "</div>" : "") + "</div></details>";
      }

      function tastingCard(t) {
        return '<article class="record"><div class="record-top"><div><h3>' + esc(t.varietyName) + "</h3><p>" + esc(t.farmName) + "</p></div><time>" + esc(shortDate(t.tastedOn)) + '</time></div><p>' + esc(t.note) + '</p><div class="record-meta">' +
          (t.spec ? "<span>" + esc(t.spec) + "</span>" : "") +
          (t.price > 0 ? "<span>" + esc(won(t.price)) + "</span>" : "") +
          (t.rating > 0 ? '<span class="stars">' + "★".repeat(t.rating) + "☆".repeat(5 - t.rating) + "</span>" : "") +
          "</div></article>";
      }

      function render() {
        subnavEl.innerHTML = SUB_TABS.map(function (pair) {
          return '<button type="button" data-action="sub" data-id="' + pair[0] + '" class="' + (state.sub === pair[0] ? "on" : "") + '">' + pair[1] + "</button>";
        }).join("");
        bottomnavEl.innerHTML = MAIN_TABS.map(function (tab) {
          if (tab.current) return '<span class="active" aria-current="page">' + tab.label + "</span>";
          return '<a href="' + tab.href + '">' + tab.label + "</a>";
        }).join("");

        var q = norm(state.search);
        var html = "";
        if (state.sub === "varieties") {
          var varieties = data.varieties.filter(function (v) {
            return (!state.season || v.season === state.season) && (!state.flesh || v.flesh === state.flesh) &&
              (!q || norm([v.name].concat(v.aliases, [v.description]).join(" ")).includes(q));
          });
          html = '<header class="headline"><h1>복숭아 품종</h1><p>' + varieties.length + '종 · 수확 시기와 식감으로 찾기</p></header>' +
            searchBox("품종 검색") +
            '<div class="filters"><select data-role="season" aria-label="숙기 필터"><option value="">모든 숙기</option>' + ["극조생", "조생", "중생", "만생"].map(function (x) { return "<option" + (state.season === x ? " selected" : "") + ">" + x + "</option>"; }).join("") + '</select><select data-role="flesh" aria-label="과육 필터"><option value="">모든 과육</option>' + ["백육", "황육", "천도"].map(function (x) { return "<option" + (state.flesh === x ? " selected" : "") + ">" + x + "</option>"; }).join("") + "</select></div>" +
            '<div class="list">' + varieties.map(varietyCard).join("") + "</div>";
        } else if (state.sub === "farms") {
          var farms = data.farms.filter(function (f) { return !q || norm([f.name, f.region, f.description].concat(f.items).join(" ")).includes(q); });
          html = '<header class="headline"><h1>복숭아 농장</h1><p>' + farms.length + '곳 · 지역과 취급 품종으로 찾기</p></header>' +
            searchBox("농장 검색") + '<div class="list">' + farms.map(farmCard).join("") + "</div>";
        } else {
          var tastings = data.tastings.filter(function (t) { return !q || norm([t.varietyName, t.farmName, t.note, t.spec].join(" ")).includes(q); });
          html = '<header class="headline"><h1>시식 기록</h1><p>' + tastings.length + '건 · 맛과 구매 기록</p></header>' +
            searchBox("시식 기록 검색") + '<div class="list">' + tastings.map(tastingCard).join("") + "</div>";
        }
        mainEl.innerHTML = html;
      }

      /* ---------- 이벤트 ---------- */
      document.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-action]");
        if (!btn) return;
        var action = btn.getAttribute("data-action");
        if (action === "sub") {
          state.sub = btn.getAttribute("data-id"); state.search = ""; render(); window.scrollTo({ top: 0 });
        } else if (action === "clear-search") {
          state.search = ""; render();
          var input = mainEl.querySelector("[data-role='search']"); if (input) input.focus();
        }
      });

      document.addEventListener("input", function (e) {
        if (e.target.matches("[data-role='search']")) {
          var pos = e.target.selectionStart;
          state.search = e.target.value;
          render();
          var input = mainEl.querySelector("[data-role='search']");
          if (input) { input.focus(); try { input.setSelectionRange(pos, pos); } catch (err) {} }
        }
      });

      document.addEventListener("change", function (e) {
        if (e.target.matches("[data-role='season']")) { state.season = e.target.value; render(); }
        else if (e.target.matches("[data-role='flesh']")) { state.flesh = e.target.value; render(); }
      });

      document.addEventListener("toggle", function (e) {
        var key = e.target.getAttribute && e.target.getAttribute("data-open-key");
        if (key) openIds[key] = e.target.open;
      }, true);

      render();
    </script>
  </body>
</html>
